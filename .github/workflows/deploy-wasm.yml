name: GitHub Pages (WebAssembly engine)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macaulay2:
        description: "macaulay2 package version on emscripten-forge-4x (empty: latest)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build (WebAssembly engine by default) and fetch Macaulay2 from emscripten-forge
        env:
          M2_VERSION: ${{ inputs.macaulay2 }}
        run: npm run build:wasm -- $M2_VERSION
      - name: Assemble the site
        run: |
          mkdir _site
          cp -rL public/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
